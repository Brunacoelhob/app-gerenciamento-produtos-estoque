name: CI

on:
  push:
    branches: [main, 'melhoria/**']
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vulnerabilidades em dependências
        run: npm audit --audit-level=high
      - name: Sobe a aplicação e confere que responde
        run: |
          npm run preparar-db
          npx concurrently -k -n api,web "npm:api" "npm:web" &
          for i in $(seq 1 30); do curl -sf localhost:3000/produtos >/dev/null && curl -sf localhost:8080/ >/dev/null && break; sleep 1; done
          curl -sf localhost:3000/produtos | grep -q "Teclado"
          curl -sf localhost:8080/js/produtos.js >/dev/null
